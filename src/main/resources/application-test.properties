# Spring Boot Test Profile Configuration
# Used when SPRING_PROFILES_ACTIVE=test

# In-memory H2 database for testing (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:covoiturage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Show SQL in test console
spring.jpa.show-sql=false

# Logging level for tests
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off

# Test specific settings
spring.jpa.properties.hibernate.jdbc.time_zone=UTC