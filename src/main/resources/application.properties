spring.application.name=covoiturage

server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:covoiturage}
spring.datasource.username=${POSTGRES_USER:covoiturage}
spring.datasource.password=${POSTGRES_PASSWORD:covoiturage}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:UTC}
