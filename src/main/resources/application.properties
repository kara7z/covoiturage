spring.application.name=covoiturage

server.port=${APP_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:covoiturage}
spring.datasource.username=${DB_USER:covoiturage}
spring.datasource.password=${DB_PASSWORD:covoiturage}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:Africa/Casablanca}

spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.static-path-pattern=/resources/**
spring.web.resources.add-mappings=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

logging.level.root=INFO
logging.level.com.youcode.covoiturage=${LOG_LEVEL:INFO}

