# Spring Boot Covoiturage Application
# Reads DB configuration from environment variables (docker-compose .env)
# Defaults match the Docker Compose PostgreSQL service configuration

spring.application.name=covoiturage

# Server port from environment (default 8080, mapped to 8081 in docker-compose)
server.port=${APP_PORT:8080}

# PostgreSQL datasource from Docker Compose environment variables
# Defaults match compose.yml: postgres:18 service with DB credentials
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:covoiturage}
spring.datasource.username=${DB_USER:covoiturage}
spring.datasource.password=${DB_PASSWORD:covoiturage}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Timezone from environment (Africa/Casablanca in docker-compose)
spring.jpa.properties.hibernate.jdbc.time_zone=${TZ:Africa/Casablanca}
