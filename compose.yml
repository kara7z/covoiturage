services:
  db:
    image: postgres:18
    container_name: covoiturage-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covoiturage} -d ${POSTGRES_DB:-covoiturage}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  app:
    build:
      context: .
      target: dev
    container_name: covoiturage-app
    restart: unless-stopped
    working_dir: /build
    entrypoint: ["mvn", "-B", "-ntp", "spring-boot:run"]
    command: []
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-covoiturage}
      DB_USER: ${POSTGRES_USER:-covoiturage}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-covoiturage}
    volumes:
      - ./src:/build/src:ro
      - m2:/root/.m2
    ports:
      - "8081:8080"
    networks:
      - app-network

volumes:
  pg_data:
  m2:

networks:
  app-network:
    driver: bridge
