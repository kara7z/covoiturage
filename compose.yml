services:
  db:
    image: postgres:18
    container_name: covoiturage-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-covoiturage} -d ${POSTGRES_DB:-covoiturage}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  app:
    build: .
    container_name: covoiturage-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8081:8080"
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
