services:
  db:
    image: postgres:15
    container_name: covoiturage-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    container_name: covoiturage-app
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - .:/app
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
